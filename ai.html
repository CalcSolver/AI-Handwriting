<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puter.js AI App</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      color: #333;
    }
    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      box-sizing: border-box;
      resize: vertical;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      background-color: #0070f3;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0051a2;
    }
    #output {
      margin-top: 20px;
      padding: 15px;
      background: #f4f4f4;
      border-radius: 6px;
      white-space: pre-wrap;
      line-height: 1.5;
    }
  </style>
  
  <!-- Load Puter.js (No API key needed) -->
  <script src="https://js.puter.com/v2/"></script>
</head>
<body>

  <h2>Zero-Key AI Tool</h2>
  <textarea id="prompt" placeholder="Ask anything..."></textarea><br>
  <button onclick="askAI()">Submit</button>

  <h3>Response:</h3>
  <div id="output">Your response will appear here...</div>

  <script>
    async function askAI() {
      const promptText = document.getElementById("prompt").value;
      const outputDiv = document.getElementById("output");

      if (!promptText.trim()) {
        outputDiv.innerText = "Please enter a prompt first.";
        return;
      }

      outputDiv.innerText = "Thinking...";

      try {
        // Send request through Puter's client-side library
        const response = await puter.ai.chat(promptText);
        
        // Extract and display the answer text
        outputDiv.innerText = response;
      } catch (err) {
        outputDiv.innerText = "Error: " + err.message;
      }
    }
  </script>

</body>
</html>

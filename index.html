<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Handwriting AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Full-screen responsive iframe wrapper */
    .iframe-container {
      width: 100%;
      height: 100vh;
      border: none;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="iframe-container">
    <iframe 
      src="https://my-handwriting-ai.vercel.app/" 
      title="Handwriting AI Studio"
      allow="clipboard-read; clipboard-write;"
      sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-downloads">
    </iframe>
  </div>

</body>
</html>

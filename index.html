<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Handwriting AI Generator</title>
  <style>
    :root {
      --primary: #4f46e5;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      gap: 24px;
    }

    h1 {
      text-align: center;
      margin-bottom: 0;
      color: var(--primary);
    }

    p.subtitle {
      text-align: center;
      color: #64748b;
      margin-top: 4px;
    }

    .card {
      background: var(--card);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--border);
    }

    /* Trainer / Drawing Section */
    .trainer-grid {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .char-select {
      font-size: 1.5rem;
      font-weight: bold;
      padding: 8px 12px;
      border-radius: 8px;
      border: 2px solid var(--primary);
      outline: none;
    }

    canvas.draw-box {
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      background: #fff;
      cursor: crosshair;
      touch-action: none;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button.secondary {
      background: #64748b;
    }

    button.danger {
      background: #ef4444;
    }

    .samples-preview {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .sample-badge {
      background: #f1f5f9;
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Output Section */
    textarea {
      width: 100%;
      height: 100px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 1.1rem;
      box-sizing: border-box;
      resize: vertical;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin: 16px 0;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.875rem;
    }

    canvas.paper-output {
      width: 100%;
      height: 450px;
      border-radius: 8px;
      background: #fefcf0;
      border: 1px solid #ebdca8;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.03);
    }
  </style>
</head>
<body>

<div class="container">
  <div>
    <h1>Handwriting AI Studio</h1>
    <p class="subtitle">Sample your handwriting, refine strokes, and render realistic written notes.</p>
  </div>

  <!-- Step 1: Input Sample Handwriting -->
  <div class="card">
    <h2>1. Draw Character Samples</h2>
    <p style="font-size: 0.9rem; color: #64748b;">
      Characters save automatically to local storage so you don't lose progress on page refresh.
    </p>
    
    <div class="trainer-grid">
      <select id="charSelect" class="char-select"></select>
      <canvas id="drawCanvas" width="180" height="180" class="draw-box"></canvas>
      
      <div class="btn-group">
        <button id="saveCharBtn">Save Character</button>
        <button id="clearPadBtn" class="secondary">Clear Pad</button>
        <button id="resetAllBtn" class="danger">Delete All Saved Letters</button>
      </div>
    </div>

    <div id="samplesList" class="samples-preview"></div>
  </div>

  <!-- Step 2: Prompt Input & Controls -->
  <div class="card">
    <h2>2. Enter Prompt & Generate</h2>
    <textarea id="promptInput" placeholder="Type your prompt here...">Hello world! Your saved handwriting will load automatically.</textarea>

    <div class="controls">
      <div class="control-group">
        <label for="slant">Handwriting Slant/Jitter</label>
        <input type="range" id="slant" min="0" max="15" value="3">
      </div>
      <div class="control-group">
        <label for="spacing">Word Spacing</label>
        <input type="range" id="spacing" min="20" max="80" value="45">
      </div>
      <div class="control-group">
        <label for="size">Font Size</label>
        <input type="range" id="size" min="30" max="90" value="56">
      </div>
    </div>

    <div class="btn-group" style="margin-bottom: 16px;">
      <button id="generateBtn">Generate Handwriting</button>
      <button id="copyBtn" class="secondary">Copy Image to Clipboard</button>
      <button id="downloadBtn" class="secondary">Download PNG</button>
    </div>

    <canvas id="outputCanvas" width="900" height="450" class="paper-output"></canvas>
  </div>
</div>

<script>
  const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789.,!? ";
  const charSelect = document.getElementById('charSelect');
  const samplesList = document.getElementById('samplesList');
  
  alphabet.split('').forEach(char => {
    const opt = document.createElement('option');
    opt.value = char === ' ' ? 'SPACE' : char;
    opt.textContent = char === ' ' ? 'Space (Blank)' : char;
    charSelect.appendChild(opt);
  });

  // Load from Local Storage on init
  let glyphStore = {};
  const savedGlyphs = localStorage.getItem('hw_ai_glyphs');
  if (savedGlyphs) {
    try {
      glyphStore = JSON.parse(savedGlyphs);
    } catch (e) {
      console.error('Could not parse saved glyphs', e);
    }
  }

  // Drawing Pad Logic
  const drawCanvas = document.getElementById('drawCanvas');
  const dCtx = drawCanvas.getContext('2d');
  let isDrawing = false;
  let currentStrokes = [];
  let currentPath = [];

  function resetDrawPad() {
    dCtx.fillStyle = "#ffffff";
    dCtx.fillRect(0, 0, drawCanvas.width, drawCanvas.height);
    
    // Draw baseline guide line
    dCtx.strokeStyle = "#e2e8f0";
    dCtx.lineWidth = 1;
    dCtx.beginPath();
    dCtx.moveTo(0, 135);
    dCtx.lineTo(180, 135);
    dCtx.stroke();
    currentStrokes = [];
  }
  resetDrawPad();

  function getPos(e) {
    const rect = drawCanvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: clientX - rect.left,
      y: clientY - rect.top
    };
  }

  function startDrawing(e) {
    isDrawing = true;
    currentPath = [];
    const pos = getPos(e);
    currentPath.push(pos);
    dCtx.beginPath();
    dCtx.lineWidth = 3.5;
    dCtx.lineCap = 'round';
    dCtx.lineJoin = 'round';
    dCtx.strokeStyle = '#000000';
    dCtx.moveTo(pos.x, pos.y);
  }

  function draw(e) {
    if (!isDrawing) return;
    e.preventDefault();
    const pos = getPos(e);
    currentPath.push(pos);
    dCtx.lineTo(pos.x, pos.y);
    dCtx.stroke();
  }

  function stopDrawing() {
    if (isDrawing) {
      isDrawing = false;
      if (currentPath.length > 0) {
        currentStrokes.push(smoothPath(currentPath));
      }
    }
  }

  drawCanvas.addEventListener('mousedown', startDrawing);
  drawCanvas.addEventListener('mousemove', draw);
  drawCanvas.addEventListener('mouseup', stopDrawing);
  drawCanvas.addEventListener('touchstart', startDrawing);
  drawCanvas.addEventListener('touchmove', draw);
  drawCanvas.addEventListener('touchend', stopDrawing);

  document.getElementById('clearPadBtn').addEventListener('click', resetDrawPad);

  // Smoothing algorithm using moving average (Makes writing neater)
  function smoothPath(path) {
    if (path.length <= 2) return path;
    const smoothed = [path[0]];
    for (let i = 1; i < path.length - 1; i++) {
      smoothed.push({
        x: (path[i - 1].x + path[i].x + path[i + 1].x) / 3,
        y: (path[i - 1].y + path[i].y + path[i + 1].y) / 3
      });
    }
    smoothed.push(path[path.length - 1]);
    return smoothed;
  }

  // Save Sample
  document.getElementById('saveCharBtn').addEventListener('click', () => {
    const char = charSelect.value === 'SPACE' ? ' ' : charSelect.value;
    if (currentStrokes.length === 0 && char !== ' ') {
      alert("Please draw something first!");
      return;
    }
    
    glyphStore[char] = currentStrokes;
    localStorage.setItem('hw_ai_glyphs', JSON.stringify(glyphStore));
    
    updateBadges();
    resetDrawPad();

    if (charSelect.selectedIndex < charSelect.options.length - 1) {
      charSelect.selectedIndex++;
    }
  });

  // Clear local storage
  document.getElementById('resetAllBtn').addEventListener('click', () => {
    if (confirm("Are you sure you want to clear all saved letters?")) {
      glyphStore = {};
      localStorage.removeItem('hw_ai_glyphs');
      updateBadges();
    }
  });

  function updateBadges() {
    samplesList.innerHTML = '';
    Object.keys(glyphStore).forEach(key => {
      const badge = document.createElement('div');
      badge.className = 'sample-badge';
      badge.textContent = `'${key === ' ' ? 'Space' : key}' Saved`;
      samplesList.appendChild(badge);
    });
  }
  updateBadges();

  // Rendering Engine
  const outCanvas = document.getElementById('outputCanvas');
  const oCtx = outCanvas.getContext('2d');

  function renderLinedPaper() {
    oCtx.fillStyle = "#fefcf0";
    oCtx.fillRect(0, 0, outCanvas.width, outCanvas.height);

    oCtx.strokeStyle = "#e2e8f0";
    oCtx.lineWidth = 1.5;
    for (let y = 80; y < outCanvas.height; y += 60) {
      oCtx.beginPath();
      oCtx.moveTo(0, y);
      oCtx.lineTo(outCanvas.width, y);
      oCtx.stroke();
    }
  }

  function generateHandwriting() {
    renderLinedPaper();

    const text = document.getElementById('promptInput').value;
    const jitterVal = parseFloat(document.getElementById('slant').value);
    const spaceWidth = parseFloat(document.getElementById('spacing').value);
    const fontSize = parseFloat(document.getElementById('size').value);
    
    const scale = fontSize / 180;
    let cursorX = 40;
    let cursorY = 80;
    const marginX = 40;
    const lineGap = 60;

    // Ink rendering config (Black text)
    oCtx.lineWidth = Math.max(2, fontSize * 0.06);
    oCtx.lineCap = 'round';
    oCtx.lineJoin = 'round';
    oCtx.strokeStyle = '#000000';

    for (let i = 0; i < text.length; i++) {
      const char = text[i];

      if (char === '\n' || cursorX > outCanvas.width - 60) {
        cursorX = marginX;
        cursorY += lineGap;
        if (cursorY > outCanvas.height - 40) break;
      }

      if (char === ' ') {
        cursorX += spaceWidth;
        continue;
      }

      const strokes = glyphStore[char];

      if (strokes && strokes.length > 0) {
        const letterJitterX = (Math.random() - 0.5) * (jitterVal * 0.3);
        const letterJitterY = (Math.random() - 0.5) * (jitterVal * 0.3);
        const letterAngle = (Math.random() - 0.5) * (jitterVal * 0.015);

        oCtx.save();
        oCtx.translate(cursorX + letterJitterX, cursorY + letterJitterY);
        oCtx.rotate(letterAngle);

        strokes.forEach(stroke => {
          if (stroke.length < 2) return;
          oCtx.beginPath();
          
          stroke.forEach((pt, pIdx) => {
            const px = pt.x * scale + (Math.random() - 0.5) * (jitterVal * 0.05);
            const py = (pt.y - 135) * scale + (Math.random() - 0.5) * (jitterVal * 0.05);

            if (pIdx === 0) {
              oCtx.moveTo(px, py);
            } else {
              oCtx.lineTo(px, py);
            }
          });
          oCtx.stroke();
        });

        oCtx.restore();
        cursorX += (110 * scale) + (Math.random() * 2);
      } else {
        // Fallback text in black
        oCtx.font = `${fontSize * 0.8}px sans-serif`;
        oCtx.fillStyle = '#000000';
        oCtx.fillText(char, cursorX, cursorY);
        cursorX += oCtx.measureText(char).width + 4;
      }
    }
  }

  document.getElementById('generateBtn').addEventListener('click', generateHandwriting);

  // Copy to Clipboard Logic
  document.getElementById('copyBtn').addEventListener('click', async () => {
    try {
      outCanvas.toBlob(async (blob) => {
        const item = new ClipboardItem({ 'image/png': blob });
        await navigator.clipboard.write([item]);
        alert('Copied image to clipboard!');
      });
    } catch (err) {
      alert('Copying image failed. Ensure your browser supports ClipboardItem PNG API.');
    }
  });

  // Download Output
  document.getElementById('downloadBtn').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = 'handwriting.png';
    link.href = outCanvas.toDataURL();
    link.click();
  });

  // Initial draw
  renderLinedPaper();
</script>
</body>
</html>
